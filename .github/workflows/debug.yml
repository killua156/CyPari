name: linux-debug
on: [push, workflow_dispatch]
jobs:
  probe:
    name: ${{ matrix.ref }} py${{ matrix.py }} cython${{ matrix.cython }} ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: "2.5.6_as_released", py: "3.11", cython: "3.0.11", extra: ""}
          - {ref: "2.5.6_as_released", py: "3.11", cython: "3.0.11", extra: "-U_FORTIFY_SOURCE"}
          - {ref: "2.5.6_as_released", py: "3.11", cython: "3.2.3", extra: ""}
          - {ref: "master", py: "3.11", cython: "3.0.11", extra: ""}
    env:
      CC: x86_64-conda-linux-gnu-cc
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dbg
      - uses: actions/checkout@v4
        with:
          repository: 3-manifolds/CyPari
          ref: ${{ matrix.ref }}
          path: src
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: t
          create-args: >-
            python=${{ matrix.py }} pari=2.15.5 gmp gcc_linux-64 sysroot_linux-64 pip setuptools wheel
            cython==${{ matrix.cython }}
      - name: Conda-build default flags
        run: |
          if [ -z "$CPPFLAGS" ]; then
            echo "CFLAGS=-march=nocona -mtune=haswell -ftree-vectorize -fPIC -fstack-protector-strong -fno-plt -O2 -ffunction-sections -pipe -isystem $CONDA_PREFIX/include" >> $GITHUB_ENV
            echo "CPPFLAGS=-DNDEBUG -D_FORTIFY_SOURCE=2 -O2 -isystem $CONDA_PREFIX/include" >> $GITHUB_ENV
            echo "LDFLAGS=-Wl,-O2 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,--disable-new-dtags -Wl,--gc-sections -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib -L$CONDA_PREFIX/lib" >> $GITHUB_ENV
          fi
      - name: Compiler flags
        run: echo "CFLAGS=$CFLAGS"; echo "CPPFLAGS=$CPPFLAGS"; $CC --version | head -1; micromamba list pari
      - name: gp
        run: echo 'pi()' | gp -q -f 2>&1 | cat -A || true
      - name: C probe (shared libpari)
        run: |
          $CC $CFLAGS $CPPFLAGS ${{ matrix.extra }} dbg/debug/errtest.c -o errtest $LDFLAGS -lpari -lgmp -lpthread
          ./errtest | cat -A
      - name: C probe (static libpari, like setup.py)
        run: |
          $CC $CFLAGS $CPPFLAGS ${{ matrix.extra }} dbg/debug/errtest.c -o errtest_s $CONDA_PREFIX/lib/libpari.a $LDFLAGS -lgmp -lpthread -lm
          ./errtest_s | cat -A
      - name: Build cypari
        run: |
          cd src
          sed -i '1s/^cython:/# cython:/' cypari/_pari.pyx
          head -1 cypari/_pari.pyx
          patch -p1 < ../dbg/debug/0001-link-shared-gmp.patch
          mkdir -p libcache
          ln -sf "$CONDA_PREFIX" libcache/pari
          ln -sf "$CONDA_PREFIX" libcache/gmp
          export CFLAGS="$CFLAGS ${{ matrix.extra }}"
          python -m pip install . -v --no-deps --no-build-isolation 2>&1 | tail -30
      - name: errtext
        run: |
          cd /tmp
          python - <<'PY'
          import ctypes, cypari
          from cypari import pari
          from cypari._pari import PariError
          try:
              pari('pi()')
          except PariError as e:
              print("errtext:", repr(e.errtext()), "args:", e.args[:2])
          lib = ctypes.CDLL(cypari._pari.__file__)
          try:
              lib.pari_strdup.restype = ctypes.c_char_p
              print("pari_strdup via ctypes:", lib.pari_strdup(b"not a function in function call"))
          except AttributeError as err:
              print("no symbol:", err)
          PY
          echo "exit=$?"
      - name: test suite
        run: |
          cd /tmp
          python -m cypari.test 2>&1 | tail -25
          echo "exit=${PIPESTATUS[0]}"
      - name: import only, exit code
        run: |
          cd /tmp
          python -c "import cypari; print(cypari.pari('2^100'))"; echo "exit=$?"
